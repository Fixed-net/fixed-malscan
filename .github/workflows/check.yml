name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n fixed-malscan.sh
      - name: ShellCheck (errors only)
        run: shellcheck -S error fixed-malscan.sh
      - name: Self-test (tools, checks and regexes load)
        run: bash fixed-malscan.sh -k -l
      - name: Regression samples (must-flag / must-ignore, --verify)
        run: bash tests/run.sh
